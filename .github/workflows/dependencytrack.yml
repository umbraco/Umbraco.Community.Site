name: Build and Upload SBOMs to Dependency-Track

on:
  workflow_dispatch:
  push:
    branches:
      - '*'

jobs:
  sbom-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Restore .NET dependencies
        run: dotnet restore UmbracoCommunity.sln

      - name: Generate and upload SBOM
        uses: umbraco/.github/actions/generate-sbom@main
        with:
          project_path: UmbracoCommunity.sln
          project_name: ${{ github.event.repository.name }}-backend
          project_version: ${{ github.ref_name }}
          output_file: sbom/bom-dotnet.xml
          api_key: ${{ secrets.DTRACK_API_KEY }}

  # New: tools/upgrade-umbraco.csproj isn't a member of UmbracoCommunity.sln,
  # so the old solution-level scan never covered it. Tracked separately here.
  sbom-upgrade-tool:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Restore .NET dependencies
        run: dotnet restore tools/upgrade-umbraco/upgrade-umbraco.csproj

      - name: Generate and upload SBOM
        uses: umbraco/.github/actions/generate-sbom@main
        with:
          project_path: tools/upgrade-umbraco/upgrade-umbraco.csproj
          project_name: ${{ github.event.repository.name }}-upgrade-umbraco
          project_version: ${{ github.ref_name }}
          output_file: sbom/bom-upgrade-umbraco.xml
          api_key: ${{ secrets.DTRACK_API_KEY }}

  # Each frontend tree gets its own SBOM and its own Dependency-Track
  # project, so vulnerabilities can be attributed to the package they
  # ship in. New trees: add a matrix entry below.
  #
  # Kept as an explicit list (rather than CodegardenBingo's dynamic
  # discovery) so project names stay exactly what they already are in
  # Dependency-Track - auto-slugging from folder paths would rename
  # these and orphan their existing history.
  sbom-frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tree:
          - { slug: frontend, dir: src/UmbracoCommunity.StaticAssets }
          - { slug: extensions-client, dir: src/UmbracoCommunity.Extensions/Client }
          - { slug: block-restrictions-client, dir: src/UmbracoCommunity.BlockRestrictions/Client }
          - { slug: not-found-tracker-client, dir: src/Umbraco.Community.NotFoundTracker/Client }
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'

      - name: Check for lockfile
        id: check
        working-directory: ${{ matrix.tree.dir }}
        run: |
          if [ -f package-lock.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Skipping ${{ matrix.tree.slug }} (${{ matrix.tree.dir }}) — no package-lock.json"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: ${{ matrix.tree.dir }}
        run: npm ci --no-audit --no-fund

      - name: Generate and upload SBOM
        if: steps.check.outputs.exists == 'true'
        uses: umbraco/.github/actions/generate-sbom@main
        with:
          project_path: ${{ matrix.tree.dir }}
          project_name: ${{ github.event.repository.name }}-${{ matrix.tree.slug }}
          project_version: ${{ github.ref_name }}
          output_file: sbom/bom-${{ matrix.tree.slug }}.xml
          api_key: ${{ secrets.DTRACK_API_KEY }}
